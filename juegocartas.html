<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Juegos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abel&family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@400..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Original+Surfer&display=swap"

<body>
    <div class="contenedor">
        <header>
            <img src="./img/logo_final_version_real_no_fake_link_e_mediafire.png" alt="Poke juegos logotipo"
                width="350">

            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="puntuaciones.html">Puntuaciones</a></li>
                    <li><a href="desarrollo.html">Desarrollo</a></li>
                </ul>
            </nav>
        </header>

        <main>
                <article>
                    <h1>Memotest - Juego de Cartas</h1>
                    <p>Encuentra los 6 pares de cartas en la menor cantidad de intentos posibles.</p>

                    <!-- La info del jugador y los intentos -->
                    <div id="setup-cartas">
                        <label for="jugador1-cartas">Nombre del Jugador:</label>
                        <input type="text" id="jugador1-cartas" placeholder="Ingresa tu nombre">
                        <button id="btn-iniciar-cartas" class="boton">Iniciar Juego</button>
                    </div>

                    <!-- Tablero de Cartas  -->
                    <div id="tablero-cartas" style="display: none;">
                        <h2 id="turno-cartas">Turno del jugador</h2>
                        <p id="puntajes-cartas"></p>
                        
                        <!-- aca se cargan las img de las cartas -->
                        <div id="grilla-cartas"></div>
                    </div>

                    <button id="btn-reiniciar-cartas" class="boton">Reiniciar Partida</button>
                </article>

        </main>
        <footer>
            <address>Contacto: <a href="mailto:desarrolladorapokejuegos@gmail.com">desarrolladorapokejuegos@gmail.com</a>
            </address>
